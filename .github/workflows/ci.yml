# ╔══════════════════════════════════════════════════════════════════════╗
# ║  GitHub Actions CI/CD — запускается автоматически при каждом push   ║
# ║  Файл: .github/workflows/ci.yml                                     ║
# ╚══════════════════════════════════════════════════════════════════════╝

name: CI — Tests & Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Тесты backend ──────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Jest)
    runs-on: ubuntu-latest

    env:
      # Тестовая БД — создаётся в GitHub Actions
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: testdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: test_secret_key_for_ci
      JWT_EXPIRES_IN: 1h
      PORT: 3000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install backend dependencies
        run: npm install
        working-directory: backend

      - name: 🧪 Run backend tests
        run: npm test
        working-directory: backend

  # ── Сборка frontend ────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: 🔨 Build frontend
        run: npm run build
        working-directory: frontend

      - name: ✅ Check build output exists
        run: test -d frontend/dist

  # ── Docker build (только при push в main) ─────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build backend Docker image
        run: docker build -t securevault-backend ./backend

      - name: 🐳 Build frontend Docker image
        run: docker build -t securevault-frontend ./frontend
